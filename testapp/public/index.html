<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test_App</title>
  <link rel="stylesheet" href="/layout.css">
  <link rel="stylesheet" href="/button.css">
  <link rel="stylesheet" href="/data-panel.css">
  <link rel="stylesheet" href="/card.css">
</head>
<body>
  <main class="layout-section" id="layout-section">
    <section>
      <button id="test-button" type="button">Click me</button>
      <p id="button-output">Not clicked yet</p>
    </section>
    <section>
      <div id="test-card" class="card"></div>
    </section>
    <section id="data-panel">
      <h3>Data panel</h3>
      <div id="data-panel-content"></div>
    </section>
  </main>
  <script src="/button.js"></script>
  <script src="/data-panel.js"></script>
  <script src="/card.js"></script>
  <script>
    ButtonComponent.mount(document);
    CardComponent.mount(document);
    DataPanelComponent.load(window.fetch.bind(window), document);
  </script>
</body>
</html>
